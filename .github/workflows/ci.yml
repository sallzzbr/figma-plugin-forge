name: CI

on:
  push:
  pull_request:

jobs:
  templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [starter-plugin, starter-plugin-backend]
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: validate scaffold
        working-directory: .
        run: node scripts/validate-scaffold.mjs --path templates/${{ matrix.template }}

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-links.mjs
